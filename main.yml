name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger the workflow when code is pushed to the main branch

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Action to pull the source code from GitHub
        uses: actions/checkout@v4

      # --- Build the Docker Image ---
      - name: Log in to Docker Hub
        # Action to authenticate with Docker Hub using repository secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        # Sets up Docker's build environment
        uses: docker/setup-buildx-action@v3

      - name: Define Image Tags
        # Dynamically set the tag using the commit SHA and 'latest'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            
      - name: Build and Push Docker Image
        # Action to build the image using the Dockerfile and push it to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}